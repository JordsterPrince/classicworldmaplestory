<body>

  <!-- 🎯 Stat Equivalence Calculator -->
  <section class="hero">
    <div class="hero-content">
      <h1>Stat Equivalence Calculator</h1>
      <p>1 Att = ? <br> 1 Secondary Stat = ?</p>
    </div>

  <!-- 🧮 Calculator Content -->
  <section style="padding: 60px 40px; max-width: 900px; margin: auto;">
    <div style="background: white; padding: 40px; border-radius: 18px; box-shadow: 0 12px 24px rgba(0,0,0,0.08);">
      <form id="statEqForm" style="max-width: 500px; margin: auto;">
        <div style="margin-bottom: 18px;">
          <label for="weaponType" style="font-weight:600;">Weapon Category:</label>
          <select id="weaponType" name="weaponType" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
            <option value="1H Sword">1H Sword</option>
            <option value="2H Sword">2H Sword</option>
            <option value="1H Blunt Weapon">1H Blunt Weapon</option>
            <option value="2H Blunt Weapon">2H Blunt Weapon</option>
            <option value="1H Axe">1H Axe</option>
            <option value="2H Axe">2H Axe</option>
            <option value="Spear">Spear</option>
            <option value="Polearm">Polearm</option>
            <option value="Bow">Bow</option>
            <option value="Xbow">Xbow</option>
            <option value="Claw">Claw</option>
            <option value="Dagger">Dagger</option>
          </select>
        </div>
        <div style="margin-bottom: 18px;">
          <label for="swingType" style="font-weight:600;">Swing Type:</label>
          <select id="swingType" name="swingType" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
            <option value="Swing">Swing</option>
            <option value="Stab">Stab</option>
            <option value="Shoot">Shoot</option>
            <option value="Mixed">Mixed</option>
          </select>
        </div>
        <div style="margin-bottom: 18px;">
          <label for="mainStat" style="font-weight:600;">Main Stat:</label>
          <input type="number" id="mainStat" name="mainStat" min="0" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
        </div>
        <div style="margin-bottom: 18px;">
          <label for="secondaryStat" style="font-weight:600;">Secondary Stat:</label>
          <input type="number" id="secondaryStat" name="secondaryStat" min="0" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
        </div>
        <div style="margin-bottom: 18px;">
          <label for="wAtk" style="font-weight:600;">Weapon Attack (W. ATK):</label>
          <input type="number" id="wAtk" name="wAtk" min="0" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
        </div>
        <div style="margin-bottom: 18px;">
          <label for="atkPower" style="font-weight:600;">Attack Power:</label>
          <input type="number" id="atkPower" name="atkPower" min="0" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
        </div>
        <div style="margin-bottom: 18px;">
          <label for="masteryLevel" style="font-weight:600;">Mastery Level:</label>
          <input type="number" id="masteryLevel" name="masteryLevel" min="0" max="10" step="1" value="0" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;">
          <span style="color:#888;font-size:0.95rem;">
            (0-10, affects minimum damage)
          </span>
        </div>
        <div style="margin-bottom: 18px;">
          <label for="maxMult" style="font-weight:600;">Max Multiplier:</label>
          <input type="number" id="maxMult" name="maxMult" min="0" step="0.01" value="4.0" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:1rem;" readonly>
          <span style="color:#888;font-size:0.95rem;">(Auto-set based on weapon and swing type)</span>
        </div>
        <button type="button" id="calculateStatEq" style="width:100%;padding:15px;font-size:1.1rem;font-weight:600;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;cursor:pointer;margin-top:10px;transition:transform 0.2s;">Calculate</button>
      </form>
      <div id="statEqResult" style="margin-top:24px;text-align:center;font-size:1.2rem;font-weight:600;color:#1b2a41;"></div>
      <div id="statEqEquiv" style="margin-top:16px;text-align:center;font-size:1.05rem;color:#333;"></div>
      <button id="saveStatEq" style="width:100%;padding:12px;font-size:1rem;font-weight:600;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;cursor:pointer;margin-top:18px;transition:transform 0.2s;display:none;">Save Stat Equivalents</button>
      <div id="statEqSaveMsg" style="margin-top:10px;text-align:center;color:#1b2a41;font-weight:500;"></div>
    </div>
  </section>

<script>
function toggleNav(el) {
  var nav = document.querySelector('.navbar nav');
  nav.classList.toggle('show');
  el.classList.toggle('active');
}
document.addEventListener('click', function(e) {
  var nav = document.querySelector('.navbar nav');
  var burger = document.querySelector('.hamburger');
  if (!nav.contains(e.target) && !burger.contains(e.target)) {
    nav.classList.remove('show');
    burger.classList.remove('active');
  }
});

const weaponMultipliers = {
  '1H Sword': {
    Swing: 1.8, Stab: 1.8, Shoot: null, Mixed: 1.8
  },
  '2H Sword': {
    Swing: 2.5, Stab: 2.5, Shoot: null, Mixed: 2.5
  },
  '1H Blunt Weapon': {
    Swing: 2.4, Stab: 1.2, Shoot: null, Mixed: 1.8
  },
  '2H Blunt Weapon': {
    Swing: 3.0, Stab: 2.0, Shoot: null, Mixed: 2.5
  },
  '1H Axe': {
    Swing: 2.4, Stab: 1.2, Shoot: null, Mixed: 1.8
  },
  '2H Axe': {
    Swing: 3.0, Stab: 2.0, Shoot: null, Mixed: 2.5
  },
  'Spear': {
    Swing: 1.5, Stab: 3.5, Shoot: null, Mixed: 2.5
  },
  'Polearm': {
    Swing: 3.5, Stab: 1.5, Shoot: null, Mixed: 2.5
  },
  'Bow': {
    Swing: 1.0, Stab: null, Shoot: 2.5, Mixed: 1.0
  },
  'Xbow': {
    Swing: 1.0, Stab: 1.0, Shoot: 2.5, Mixed: 1.0
  },
  'Claw': {
    Swing: null, Stab: 1.0, Shoot: 2.5, Mixed: 1.0
  },
  'Dagger': {
    Swing: 1.0, Stab: 2.0, Shoot: null, Mixed: 1.5
  }
};

function updateMaxMultiplier() {
  const weaponType = document.getElementById('weaponType').value;
  const swingType = document.getElementById('swingType').value;

  const mult = weaponMultipliers[weaponType]?.[swingType];

  document.getElementById('maxMult').value = mult ?? '';
}

document.getElementById('weaponType').addEventListener('change', updateMaxMultiplier);
document.getElementById('swingType').addEventListener('change', updateMaxMultiplier);
document.addEventListener('DOMContentLoaded', updateMaxMultiplier);

let statEqValues = { secToPrimary: 0, atkPowerToPrimary: 0, wAttToPrimary: 0 };
const STAT_EQ_SETUP_TYPE = 'stat-equivalence';
const PROFILE_API_BASE = 'https://otvk1as2n9.execute-api.us-east-1.amazonaws.com';

function getAuth() {
  return window.MSCWAuth || null;
}

function getFallbackEmail() {
  const auth = getAuth();
  if (!auth) return '';
  const payload = auth.getIdTokenPayload ? auth.getIdTokenPayload() : null;
  return payload?.email || auth.getUserEmail?.() || '';
}

function isLoggedIn() {
  const auth = getAuth();
  if (!auth || !auth.getAccessToken) return false;
  return !!auth.getAccessToken();
}

async function fetchProfileFromApi() {
  const auth = getAuth();
  const accessToken = auth?.getValidAccessToken
    ? await auth.getValidAccessToken()
    : (auth?.getAccessToken ? auth.getAccessToken() : '');
  if (!accessToken) return null;

  try {
    const response = await fetch(`${PROFILE_API_BASE}/profile`, {
      method: 'GET',
      headers: {
        Authorization: `Bearer ${accessToken}`
      }
    });

    if (!response.ok) return null;
    return await response.json();
  } catch {
    return null;
  }
}

function mergeStatEqSetup(existingSetups, values) {
  const setups = Array.isArray(existingSetups) ? existingSetups.filter(Boolean) : [];
  const filtered = setups.filter((setup) => setup?.type !== STAT_EQ_SETUP_TYPE);
  filtered.push({
    type: STAT_EQ_SETUP_TYPE,
    values
  });
  return filtered;
}

function getStatEqFromSetups(setups) {
  if (!Array.isArray(setups)) return null;
  const match = setups.find((setup) => setup?.type === STAT_EQ_SETUP_TYPE && setup?.values);
  return match?.values || null;
}

async function saveStatEqToApi(values) {
  const auth = getAuth();
  const accessToken = auth?.getValidAccessToken
    ? await auth.getValidAccessToken()
    : (auth?.getAccessToken ? auth.getAccessToken() : '');
  if (!accessToken) throw new Error('Missing access token');

  const existingProfile = await fetchProfileFromApi();
  const mergedSetups = mergeStatEqSetup(existingProfile?.equipmentSetups, values);

  const response = await fetch(`${PROFILE_API_BASE}/profile`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${accessToken}`
    },
    body: JSON.stringify({
      email: existingProfile?.email || getFallbackEmail(),
      avatar: existingProfile?.avatar,
      equipmentSetups: mergedSetups
    })
  });

  if (!response.ok) {
    throw new Error('Failed to save profile data');
  }
}

function applySavedValues(vals) {
  if (!vals || typeof vals !== 'object') return;
  if (vals.mainStat !== undefined) document.getElementById('mainStat').value = vals.mainStat;
  if (vals.secondaryStat !== undefined) document.getElementById('secondaryStat').value = vals.secondaryStat;
  if (vals.wAtk !== undefined) document.getElementById('wAtk').value = vals.wAtk;
  if (vals.atkPower !== undefined) document.getElementById('atkPower').value = vals.atkPower;
  if (vals.masteryLevel !== undefined) document.getElementById('masteryLevel').value = vals.masteryLevel;
  if (vals.weaponType !== undefined) document.getElementById('weaponType').value = vals.weaponType;
  if (vals.swingType !== undefined) document.getElementById('swingType').value = vals.swingType;
  updateMaxMultiplier();
}
document.getElementById('calculateStatEq').onclick = function() {
  const mainStat = Number(document.getElementById('mainStat').value);
  const secondaryStat = Number(document.getElementById('secondaryStat').value);
  const wAtk = Number(document.getElementById('wAtk').value);
  const atkPower = Number(document.getElementById('atkPower').value);
  const masteryLevel = Number(document.getElementById('masteryLevel').value);

  const weaponType = document.getElementById('weaponType').value;
  const swingType = document.getElementById('swingType').value;
  const maxMult = weaponMultipliers[weaponType]?.[swingType];

  const resultEl = document.getElementById('statEqResult');
  const equivEl = document.getElementById('statEqEquiv');
  const saveBtn = document.getElementById('saveStatEq');

  // Validate inputs
  const inputs = [mainStat, secondaryStat, wAtk, atkPower, masteryLevel];

  if (inputs.some(v => !Number.isFinite(v) || v < 0)) {
    resultEl.textContent = 'Please enter valid non-negative numbers.';
    equivEl.innerHTML = '';
    saveBtn.style.display = 'none';
    return;
  }

  if (!Number.isInteger(masteryLevel) || masteryLevel > 10) {
    resultEl.textContent = 'Mastery Level must be an integer between 0 and 10.';
    equivEl.innerHTML = '';
    saveBtn.style.display = 'none';
    return;
  }

  if (maxMult == null) {
    resultEl.textContent = 'Invalid weapon action for this weapon category.';
    equivEl.innerHTML = '';
    saveBtn.style.display = 'none';
    return;
  }

  if (wAtk <= 0) {
    resultEl.textContent = 'Weapon Attack must be greater than 0.';
    equivEl.innerHTML = '';
    saveBtn.style.display = 'none';
    return;
  }

  // New mastery formula
  const M = (masteryLevel / 10 + 0.1) * 0.7;

  // New physical damage formula
  const minDamage = wAtk * (
    0.8 +
    (mainStat * M * maxMult + secondaryStat) / 100 +
    atkPower / 50
  );

  const maxDamage = wAtk * (
    1.0 +
    (mainStat * maxMult + secondaryStat) / 100 +
    atkPower / 50
  );

  const avgDamage = wAtk * (
    0.9 +
    (mainStat * ((M + 1) / 2) * maxMult + secondaryStat) / 100 +
    atkPower / 50
  );

  // Display truncated damage range
  resultEl.innerHTML = `
    <div style="font-size:1.1rem;">
      <strong>Damage Range:</strong>
      <span style="font-size:1.6rem;color:#667eea;">
        ${Math.trunc(minDamage)} - ${Math.trunc(maxDamage)}
      </span>
    </div>
    <div style="font-size:1rem;color:#666;margin-top:6px;">
      Average Damage: ${avgDamage.toFixed(2)}
    </div>
  `;

  // Calculate equivalencies relative to one point of primary stat
  const primaryGain = maxMult * ((M + 1) / 2) / 100;
  const secondaryGain = 1 / 100;
  const attackPowerGain = 1 / 50;
  const weaponAttackGain = avgDamage / wAtk;

  const secToPrimary = secondaryGain / primaryGain;
  const atkPowerToPrimary = attackPowerGain / primaryGain;
  const wAttToPrimary = weaponAttackGain / (wAtk * primaryGain);

  statEqValues = {
    secToPrimary,
    atkPowerToPrimary,
    wAttToPrimary,
    mainStat,
    secondaryStat,
    wAtk,
    atkPower,
    masteryLevel,
    maxMult,
    weaponType,
    swingType
  };

  equivEl.innerHTML = `
    <div style="margin-top:10px;">
      <strong>Stat Equivalence:</strong><br>
      1 Secondary Stat = ${secToPrimary.toFixed(3)} Primary Stat<br>
      1 Attack Power = ${atkPowerToPrimary.toFixed(3)} Primary Stat<br>
      1 W.ATK = ${wAttToPrimary.toFixed(3)} Primary Stat
      <hr style="margin:10px 0;">
      <span style="color:#888;font-size:0.95rem;">
        Based on average damage. Mastery affects the primary stat's
        average damage contribution.
      </span>
    </div>
  `;

  saveBtn.style.display = 'block';
};

document.getElementById('saveStatEq').onclick = async function() {
  const messageEl = document.getElementById('statEqSaveMsg');
  const saveBtn = document.getElementById('saveStatEq');
  saveBtn.disabled = true;
  messageEl.textContent = 'Saving...';

  try {
    if (isLoggedIn()) {
      await saveStatEqToApi(statEqValues);
    }

    localStorage.setItem('statEqValues', JSON.stringify(statEqValues));
    messageEl.textContent = 'Stat equivalents and calculator values saved!';
  } catch {
    localStorage.setItem('statEqValues', JSON.stringify(statEqValues));
    messageEl.textContent = 'Saved locally only (cloud save unavailable).';
  } finally {
    saveBtn.disabled = false;
    setTimeout(() => { messageEl.textContent = ''; }, 2200);
  }
};

// Load saved values on page load
document.addEventListener('DOMContentLoaded', async function() {
  if (isLoggedIn()) {
    const profile = await fetchProfileFromApi();
    const serverValues = getStatEqFromSetups(profile?.equipmentSetups);
    if (serverValues) {
      applySavedValues(serverValues);
      localStorage.setItem('statEqValues', JSON.stringify(serverValues));
      return;
    }
  }

  const saved = localStorage.getItem('statEqValues');
  if (!saved) return;
  try {
    applySavedValues(JSON.parse(saved));
  } catch {}
});
</script>
<script src="../auth-nav.js"></script>
