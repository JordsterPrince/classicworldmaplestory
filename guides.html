<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6MB3RE46XM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6MB3RE46XM');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/decoration/MapleLeaf.png" />
  <title>Guides - MapleStory Classic World</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .guide-main-card {
      border: none;
      cursor: pointer;
      text-align: inherit;
      font-family: inherit;
    }

    .guide-main-card.is-active {
      outline: 5px solid rgba(66, 153, 225, 0.55);
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 16px 32px rgba(0,0,0,0.12);
    }

    .guide-subclass-wrap {
      max-width: 1100px;
      margin: 0 auto;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.25s ease;
    }

    .guide-subclass-wrap.mobile-inline {
      width: 100%;
      max-width: 100%;
      flex-basis: 100%;
    }

    .guide-subclass-wrap.is-open {
      max-height: 560px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 8px;
    }

    .guide-subclass-cards {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 8px 0 24px;
    }

    .guide-subclass-card {
      min-width: 180px;
      max-width: 220px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      border: 1px solid #dbe6f3;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      text-decoration: none;
      color: #1b2a41;
      padding: 16px 14px;
      transform: translateY(10px);
      opacity: 0;
      animation: subclassIn 0.28s ease forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
    }

    .guide-subclass-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.1);
      border-color: #9dc3ea;
      background-color: #e8e8e8;
    }

    .guide-subclass-card:active {
      transform: translateY(-1px);
    }

    .guide-subclass-image {
      width: 100%;
      max-height: 120px;
      object-fit: contain;
    }

    @keyframes subclassIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 900px) {
      .guide-subclass-cards {
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: space-around;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 8px 6px 18px;
      }

      .guide-subclass-card {
        width: 180px;
        min-width: 180px;
        max-width: 180px;
      }
    }
  </style>
</head>
<body>

  <!-- 🌤 Header / Navigation -->
  <header class="navbar">
    <a class="logo" href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
      <img src="images/decoration/MapleLeaf.png" alt="Maple Leaf" style="height: 32px; width: 32px; vertical-align: middle;">
      <span>MapleStory Classic World</span>
    </a>
    <div class="hamburger" onclick="toggleNav(this)">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="guides.html">Guides</a>
      <a href="calculators.html">Calculators</a>
      <a href="search.html">Library</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- 📖 Guides Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Guides</h1>
      <p>Training spots, builds, and progression tips coming soon!</p>
    </div>
  </section>

  <section style="padding: 40px 0; max-width: 1100px; margin: auto;">
    <div class="guide-cards">
      <a class="guide-card beginner" href="guides/beginner.html" style="text-decoration:none; color:inherit;">
        <div class="guide-card-title">Beginner</div>
        <div class="guide-card-icon">
          <img src="/images/decoration/beginnerStanding.png" alt="Beginner Icon">
        </div>
      </a>
      <button type="button" class="guide-card warrior guide-main-card" data-class="warrior">
        <div class="guide-card-title">Warrior</div>
        <div class="guide-card-icon">
          <img src="/images/decoration/warriorArt.png" alt="Warrior Icon">
        </div>
      </button>
      <button type="button" class="guide-card thief guide-main-card" data-class="thief">
        <div class="guide-card-title">Thief</div>
        <div class="guide-card-icon">
          <img src="/images/decoration/thiefArt.png" alt="Thief Icon">
        </div>
      </button>
      <button type="button" class="guide-card bowman guide-main-card" data-class="bowman">
        <div class="guide-card-title">Bowman</div>
        <div class="guide-card-icon">
          <img src="/images/decoration/bowmanArt.png" alt="Bowman Icon">
        </div>
      </button>
      <button type="button" class="guide-card mage guide-main-card" data-class="mage">
        <div class="guide-card-title">Mage</div>
        <div class="guide-card-icon">
          <img src="/images/decoration/magicianArt.png" alt="Mage Icon">
        </div>
      </button>
    </div>

    <div id="subclassWrap" class="guide-subclass-wrap" aria-live="polite">
      <div id="subclassCards" class="guide-subclass-cards"></div>
    </div>
  </section>

<script>
function toggleNav(el) {
  var nav = document.querySelector('.navbar nav');
  nav.classList.toggle('show');
  el.classList.toggle('active');
}
document.addEventListener('click', function(e) {
  var nav = document.querySelector('.navbar nav');
  var burger = document.querySelector('.hamburger');
  if (!nav.contains(e.target) && !burger.contains(e.target)) {
    nav.classList.remove('show');
    burger.classList.remove('active');
  }
});

const subclassMap = {
  warrior: [
    { name: 'Fighter', href: 'guides/hero.html', image: '/images/decoration/heroAlert.png' },
    { name: 'Spearman', href: 'guides/dark-knight.html', image: '/images/decoration/darkKnightalert.png' },
    { name: 'Page', href: 'guides/paladin.html', image: '/images/decoration/paladinAlert.png' }
  ],
  thief: [
    { name: 'Bandit', href: 'guides/bandit.html', image: '/images/decoration/banditAlert.png' },
    { name: 'Assassin', href: 'guides/assassin.html', image: '/images/decoration/assassinAlert.png' }
  ],
  bowman: [
    { name: 'Hunter', href: 'guides/bowman.html', image: '/images/decoration/bowmanAlert.png' },
    { name: 'Crossbowman', href: 'guides/crossbowman.html', image: '/images/decoration/crossbowmanAlert.png' }
  ],
  mage: [
    { name: 'Cleric', href: 'guides/cleric.html', image: '/images/decoration/clericAlert.png' },
    { name: 'Ice/Lightning', href: 'guides/ice-lightning.html', image: '/images/decoration/ilAlert.png' },
    { name: 'Fire/Poison', href: 'guides/fire-poison.html', image: '/images/decoration/fpalert.png' }
  ]
};

const subclassWrap = document.getElementById('subclassWrap');
const subclassCards = document.getElementById('subclassCards');
const guideCardsContainer = document.querySelector('.guide-cards');
const mainClassCards = document.querySelectorAll('.guide-main-card');
let activeClass = null;

function isMobileGuideLayout() {
  return window.matchMedia('(max-width: 900px)').matches;
}

function placeSubclassWrap(activeCard) {
  if (!subclassWrap || !guideCardsContainer) return;

  if (isMobileGuideLayout() && activeCard) {
    subclassWrap.classList.add('mobile-inline');
    activeCard.insertAdjacentElement('afterend', subclassWrap);
  } else {
    subclassWrap.classList.remove('mobile-inline');
    guideCardsContainer.insertAdjacentElement('afterend', subclassWrap);
  }
}

function renderSubclasses(classKey) {
  const subclasses = subclassMap[classKey] || [];
  subclassCards.innerHTML = subclasses
    .map((subclass, index) => `
      <a href="${subclass.href}" class="guide-subclass-card" style="animation-delay:${index * 0.06}s">
        <img src="${subclass.image}" alt="${subclass.name}" class="guide-subclass-image">
        <strong>${subclass.name}</strong>
      </a>
    `)
    .join('');
}

mainClassCards.forEach(card => {
  card.addEventListener('click', () => {
    const classKey = card.dataset.class;

    if (activeClass === classKey) {
      activeClass = null;
      subclassWrap.classList.remove('is-open');
      mainClassCards.forEach(c => c.classList.remove('is-active'));
      placeSubclassWrap(null);
      return;
    }

    activeClass = classKey;
    renderSubclasses(classKey);
    placeSubclassWrap(card);
    subclassWrap.classList.add('is-open');
    mainClassCards.forEach(c => c.classList.remove('is-active'));
    card.classList.add('is-active');

    requestAnimationFrame(() => {
      subclassWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
});

window.addEventListener('resize', () => {
  if (!activeClass) {
    placeSubclassWrap(null);
    return;
  }

  const activeCard = document.querySelector(`.guide-main-card[data-class="${activeClass}"]`);
  placeSubclassWrap(activeCard);
});
</script>
<script src="auth-nav.js"></script>
</body>
</html>
