<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="MapleLeaf.png" />
  <title>Guides - MapleStory Classic World</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🌤 Header / Navigation -->
  <header class="navbar">
    <a class="logo" href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
      <img src="MapleLeaf.png" alt="Maple Leaf" style="height: 32px; width: 32px; vertical-align: middle;">
      <span>MapleStory Classic World</span>
    </a>
    <div class="hamburger" onclick="toggleNav(this)">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="guides.html">Guides</a>
      <a href="calculators.html">Calculators</a>
      <a href="search.html">Library</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- 📖 Guides Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Guides</h1>
      <p>Training spots, builds, and progression tips coming soon!</p>
    </div>
  </section>

  <section style="padding: 40px 0; max-width: 1100px; margin: auto;">
    <div class="guide-cards">
      <div class="guide-card beginner">
        <div class="guide-card-title">Beginner</div>
        <div class="guide-card-icon">
          <img src="https://maplestory.io/api/GMS/263/item/1002562/icon?resize=4" alt="Beginner Icon">
        </div>
      </div>
      <div class="guide-card warrior">
        <div class="guide-card-title">Warrior</div>
        <div class="guide-card-icon">
          <img src="https://maplestory.io/api/GMS/263/npc/10202/icon/" alt="Warrior Icon">
        </div>
      </div>
      <div class="guide-card thief">
        <div class="guide-card-title">Thief</div>
        <div class="guide-card-icon">
          <img src="https://maplestory.io/api/GMS/263/npc/10203/icon/" alt="Thief Icon">
        </div>
      </div>
      <div class="guide-card bowman">
        <div class="guide-card-title">Bowman</div>
        <div class="guide-card-icon">
          <img src="https://maplestory.io/api/GMS/263/npc/9000023/icon/" alt="Bowman Icon">
        </div>
      </div>
      <div class="guide-card mage">
        <div class="guide-card-title">Mage</div>
        <div class="guide-card-icon">
          <img src="https://maplestory.io/api/GMS/263/npc/10201/icon/" alt="Mage Icon">
        </div>
      </div>
    </div>
  </section>

<script>
function toggleNav(el) {
  var nav = document.querySelector('.navbar nav');
  nav.classList.toggle('show');
  el.classList.toggle('active');
}
document.addEventListener('click', function(e) {
  var nav = document.querySelector('.navbar nav');
  var burger = document.querySelector('.hamburger');
  if (!nav.contains(e.target) && !burger.contains(e.target)) {
    nav.classList.remove('show');
    burger.classList.remove('active');
  }
});
</script>
</body>
</html>
